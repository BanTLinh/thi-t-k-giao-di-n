<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Image Gallery</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .gallery-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }
        .gallery-img:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body class="bg-light">

    <div class="container my-5">
        <h1 class="text-center mb-4 fw-bold text-primary">Responsive Image Gallery</h1>
        
        <!-- Lưới Bootstrap -->
        <div class="row g-4">
            
            <!-- Ảnh 1 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm p-2">
                    <img src="https://picsum.photos/400/300?random=1" class="gallery-img" alt="Gallery Image 1">
                </div>
            </div>

            <!-- Ảnh 2 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm p-2">
                    <img src="https://picsum.photos/400/300?random=2" class="gallery-img" alt="Gallery Image 2">
                </div>
            </div>

            <!-- Ảnh 3 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm p-2">
                    <img src="https://picsum.photos/400/300?random=3" class="gallery-img" alt="Gallery Image 3">
                </div>
            </div>

            <!-- Ảnh 4 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm p-2">
                    <img src="https://picsum.photos/400/300?random=4" class="gallery-img" alt="Gallery Image 4">
                </div>
            </div>

            <!-- Ảnh 5 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm p-2">
                    <img src="https://picsum.photos/400/300?random=5" class="gallery-img" alt="Gallery Image 5">
                </div>
            </div>

            <!-- Ảnh 6 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm p-2">
                    <img src="https://picsum.photos/400/300?random=6" class="gallery-img" alt="Gallery Image 6">
                </div>
            </div>

            <!-- Ảnh 7 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm p-2">
                    <img src="https://picsum.photos/400/300?random=7" class="gallery-img" alt="Gallery Image 7">
                </div>
            </div>

            <!-- Ảnh 8 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm p-2">
                    <img src="https://picsum.photos/400/300?random=8" class="gallery-img" alt="Gallery Image 8">
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
