<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sử dụng CSS để thay đổi thuộc tính HTML</title>
    <style>
        h1 {
            color: blue;
            font-family: Tahoma, sans-serif;
            font-size: 200%;
        }
        p {
            color: red;
            font-family: Arial, sans-serif;
            font-size: 120%;
            border: 1px solid grey;
            padding: 10px;
        }
        #element1 {
            color: blue;
        }
    </style>
</head>
<body>

<h1>Đây là đề mục</h1>

<p>Đây là đoạn văn bản 1.</p>
<p>Đây là đoạn văn bản 2.</p>
<p>Đây là đoạn văn bản 3.</p>
<p id="element1">Đoạn văn bản có thuộc tính id</p>

</body>
</html>
